# cargo-deny: which licenses, advisories and sources plnwrk accepts (docs/PLAN.md §2).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Accepted on purpose, each with its reason; reviewed with every egui update.
ignore = [
  # 2026-10-17: zbus_names, zvariant and zvariant_derive are "unmaintained" (merged into
  # zbus 6), not vulnerable. They come only through egui's Linux screen-reader bridge
  # (eframe → accesskit_unix → atspi → zbus 5); there is no safe upgrade yet. Dropping them
  # would mean no screen reader on Linux. Remove these lines once egui uses zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, only via accesskit_unix (zbus 5); no upgrade until egui moves to zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, only via accesskit_unix (zbus 5); no upgrade until egui moves to zbus 6" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, only via accesskit_unix (zbus 5); no upgrade until egui moves to zbus 6" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
