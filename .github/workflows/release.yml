name: release

# Builds the installable packages of plnwrk – macOS (one app for Apple silicon and Intel, .dmg),
# Windows (.zip) and Linux (.tar.gz), each with the app and plnwrk-cli – and publishes them as a
# GitHub release when a tag v<version> is pushed. Started by hand (Actions → release → Run
# workflow) or by a pull request that changes it, it is a trial run: the packages are kept as
# workflow artifacts, nothing is published. docs/plans/2026-10-16-phase-8.md.
#
# The packages are not signed (decision 2026-10-16): macOS and Windows warn on first start;
# docs/handbuch.md explains how to open them anyway.
#
# Actions are pinned to commits (tag in the comment); only the publish job may write. A release
# is made only from a tag that matches the version in Cargo.toml, on a commit of main whose CI
# ran green (job `check`) – push the tag once the CI of that commit on main is through.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # A change to this workflow is tried out in its pull request (built, never published).
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "xtask/src/app.rs"
      - "apps/plnwrk/**"
      - "apps/plnwrk-cli/**"
      - "Cargo.lock"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: a release only from a green commit on main, with the version as tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version $version in Cargo.toml" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not on main: releases come only from reviewed, merged work" >&2
            exit 1
          fi
          for job in "gate (ubuntu-24.04)" "gate (macos-latest)"; do
            result=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq "[.check_runs[] | select(.name == \"$job\")] | sort_by(.completed_at) | last | .conclusion")
            if [ "$result" != "success" ]; then
              echo "CI \"$job\" on $GITHUB_SHA: ${result:-not run} – wait until it is green" >&2
              exit 1
            fi
          done

  macos:
    needs: check
    runs-on: macos-15
    permissions:
      contents: read
    env:
      # Smaller programs without symbol tables (only here: stripping would also remove what
      # wasm-opt needs from the browser build).
      RUSTFLAGS: -C strip=symbols
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: app (universal)
        run: cargo xtask app --universal
      - name: plnwrk-cli (universal)
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p plnwrk-cli --target "$t"
          done
          lipo -create target/aarch64-apple-darwin/release/plnwrk-cli \
            target/x86_64-apple-darwin/release/plnwrk-cli -output target/plnwrk-cli
          # Not signed with a certificate, but sealed (ad hoc), like the app.
          codesign --force --sign - target/plnwrk-cli
      - name: dmg
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist/dmg
          cp -R target/plnwrk.app dist/dmg/
          cp target/plnwrk-cli dist/dmg/
          ln -s /Applications dist/dmg/Programme
          hdiutil create -volname "plnwrk $version" -srcfolder dist/dmg -ov -format UDZO \
            "dist/plnwrk-$version-macos.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # No Visual C++ runtime needed on the target computer; no symbol tables.
      RUSTFLAGS: -C target-feature=+crt-static -C strip=symbols
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: build
        run: cargo build --release --locked -p plnwrk -p plnwrk-cli
      - name: zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist/plnwrk | Out-Null
          Copy-Item target/release/plnwrk.exe, target/release/plnwrk-cli.exe dist/plnwrk/
          Compress-Archive -Path dist/plnwrk/* -DestinationPath "dist/plnwrk-$version-windows-x86_64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  linux:
    needs: check
    # The oldest supported Ubuntu, so the program runs on older glibc too (22.04: glibc 2.35).
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      RUSTFLAGS: -C strip=symbols
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: build
        run: cargo build --release --locked -p plnwrk -p plnwrk-cli
      - name: tar.gz
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          dir="dist/plnwrk-$version"
          mkdir -p "$dir"
          cp target/release/plnwrk target/release/plnwrk-cli "$dir/"
          cp apps/plnwrk/assets/icon-1024.png "$dir/plnwrk.png"
          cat > "$dir/plnwrk.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=plnwrk
          Comment=Projekte und Vorgänge
          Exec=plnwrk %f
          Icon=plnwrk
          Categories=Office;ProjectManagement;
          MimeType=application/x-plnwrk;
          DESKTOP
          tar -C dist -czf "dist/plnwrk-$version-linux-x86_64.tar.gz" "plnwrk-$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    # Only for a pushed tag (checked in `check`); a run started by hand – even on a tag – or by
    # a pull request stops before this.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" \
            --title "plnwrk ${GITHUB_REF_NAME#v}" \
            --notes "Installieren: https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/handbuch.md – die Pakete sind nicht signiert; macOS und Windows warnen beim ersten Start. plnwrk ist noch nicht für echte Verschlusssachen gedacht. Prüfsummen: SHA256SUMS."
