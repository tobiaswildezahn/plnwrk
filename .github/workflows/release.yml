name: release

# Builds the installable packages of plnwrk – macOS (one app for Apple silicon and Intel, .dmg),
# Windows (.zip) and Linux (.tar.gz), each with the app and plnwrk-cli – and publishes them as a
# GitHub release when a tag v<version> is pushed. Started by hand (Actions → release → Run
# workflow) or by a pull request that changes it, it is a trial run: the packages are kept as
# workflow artifacts, nothing is published. docs/plans/2026-10-16-phase-8.md.
#
# The packages are not signed (decision 2026-10-16): macOS and Windows warn on first start;
# docs/handbuch.md explains how to open them anyway.
#
# Actions are pinned to commits (tag in the comment); only the publish job may write.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # A change to this workflow is tried out in its pull request (built, never published).
  pull_request:
    paths: [".github/workflows/release.yml", "xtask/src/app.rs"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: app (universal)
        run: cargo xtask app --universal
      - name: plnwrk-cli (universal)
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p plnwrk-cli --target "$t"
          done
          lipo -create target/aarch64-apple-darwin/release/plnwrk-cli \
            target/x86_64-apple-darwin/release/plnwrk-cli -output target/plnwrk-cli
      - name: dmg
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist/dmg
          cp -R target/plnwrk.app dist/dmg/
          cp target/plnwrk-cli dist/dmg/
          ln -s /Applications dist/dmg/Programme
          hdiutil create -volname "plnwrk $version" -srcfolder dist/dmg -ov -format UDZO \
            "dist/plnwrk-$version-macos.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # No Visual C++ runtime needed on the target computer.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: build
        run: cargo build --release --locked -p plnwrk -p plnwrk-cli
      - name: zip
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist/plnwrk | Out-Null
          Copy-Item target/release/plnwrk.exe, target/release/plnwrk-cli.exe dist/plnwrk/
          Compress-Archive -Path dist/plnwrk/* -DestinationPath "dist/plnwrk-$version-windows-x86_64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: build
        run: cargo build --release --locked -p plnwrk -p plnwrk-cli
      - name: tar.gz
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          dir="dist/plnwrk-$version"
          mkdir -p "$dir"
          cp target/release/plnwrk target/release/plnwrk-cli "$dir/"
          cp apps/plnwrk/assets/icon-1024.png "$dir/plnwrk.png"
          cat > "$dir/plnwrk.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=plnwrk
          Comment=Projekte und Vorgänge
          Exec=plnwrk %f
          Icon=plnwrk
          Categories=Office;ProjectManagement;
          MimeType=application/x-plnwrk;
          DESKTOP
          tar -C dist -czf "dist/plnwrk-$version-linux-x86_64.tar.gz" "plnwrk-$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    # Only for a tag; a run started by hand stops before this.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: the tag matches the version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version $version in Cargo.toml" >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "plnwrk ${GITHUB_REF_NAME#v}" \
            --notes "Installieren: siehe docs/handbuch.md. Die Pakete sind nicht signiert; macOS und Windows warnen beim ersten Start. Prüfsummen: SHA256SUMS."
