name: pages

# Publishes the browser version on GitHub Pages. Started by hand only (Actions → pages → Run
# workflow): publishing makes the app reachable under a public address. The app sends no data
# anywhere; files stay on the computer (upload/download). Needs Pages enabled in the
# repository settings with "GitHub Actions" as source. docs/plans/2026-10-14-phase-4.md.
#
# Served under an own subdomain (decision 2026-10-16, docs/plans/2026-10-16-phase-8.md): the
# browser's storage (recovery copies, in plain text) is shared by every page of the same
# address, so plnwrk must not live under <owner>.github.io next to other Pages sites. The
# domain is set in the repository's Pages settings; its DNS name points (CNAME) to
# <owner>.github.io.
#
# Actions are pinned to commits (tag in the comment); only the deploy job may publish.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: trunk@0.21.14
      - name: trunk build
        working-directory: apps/plnwrk-web
        # Served at the root of the own subdomain.
        run: trunk build --release --locked --public-url "/"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/plnwrk-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
