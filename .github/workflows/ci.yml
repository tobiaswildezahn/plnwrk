name: ci

# Linux, macOS and the web bundle run on every push. Windows is slow (≈ 15 min) and runs only
# right before a merge: when a pull request gets the label `merge` (and on later pushes while
# it has it). docs/PLAN.md §9, 2026-10-14.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  # Adding the label starts its own run, which must not cancel the run of the last push.
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'push' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate (${{ matrix.os }})
    if: github.event.action != 'labeled'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system libraries for egui
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-llvm-cov@0.9.1
      - run: cargo xtask ci
      - name: Cargo.lock is up to date
        run: git diff --exit-code Cargo.lock

  gate-windows:
    name: gate (windows-latest)
    if: >-
      github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'merge')
      && (github.event.action != 'labeled' || github.event.label.name == 'merge')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-llvm-cov@0.9.1
      - run: cargo xtask ci
      - name: Cargo.lock is up to date
        run: git diff --exit-code Cargo.lock

  web:
    name: web bundle
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      - name: trunk build
        working-directory: apps/plnwrk-web
        run: trunk build --release --locked
