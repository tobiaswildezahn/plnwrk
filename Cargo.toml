[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/tobiaswildezahn/plnwrk"
rust-version = "1.99"
publish = false

[workspace.dependencies]
plnwrk-core = { path = "crates/core" }
plnwrk-engine = { path = "crates/engine" }
plnwrk-store = { path = "crates/store" }
plnwrk-schedule = { path = "crates/schedule" }
plnwrk-assistant = { path = "crates/assistant" }
plnwrk-mcp = { path = "crates/mcp" }
plnwrk-ui = { path = "crates/ui" }
plnwrk-platform = { path = "crates/platform" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit", "persistence"] }
age = "0.12.1"
blake3 = "1.8.7"
clap = "4.6.7"
egui = "0.36.2"
egui_kittest = "0.36.2"
getrandom = "0.4.3"
insta = { version = "1.49", features = ["json"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde"] }
log = "0.4"
proptest = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
ulid = { version = "3.0.0", default-features = false }
unicode-normalization = "0.1.25"
zeroize = "1.9.1"
serde_json = { version = "1.0.154", features = ["raw_value", "float_roundtrip"] }
wasm-bindgen = "0.2"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rpassword = "7.5.4"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Never crash (docs/PLAN.md §2). `forbid` cannot be switched off with `#[allow]`; tests are
# exempt through clippy.toml. `cargo xtask ci` also passes these as -F flags, so they hold for
# every crate even if its manifest forgets `[lints] workspace = true`.
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"
exit = "forbid"
disallowed_methods = "forbid"
disallowed_types = "forbid"
dbg_macro = "deny"
print_stdout = "deny"
allow_attributes_without_reason = "deny"

# Cryptography is slow without optimisation; debug builds and tests optimise it anyway so that
# opening an encrypted file takes a second, not ten.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
