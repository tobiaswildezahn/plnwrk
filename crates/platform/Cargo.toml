[package]
name = "plnwrk-platform"
description = "The real clock and randomness for plnwrk apps (never used by the pure core)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
getrandom.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
plnwrk-core.workspace = true
ulid.workspace = true

# In the browser, time and randomness come from JavaScript.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
jiff = { workspace = true, features = ["js"] }

[lints]
workspace = true
