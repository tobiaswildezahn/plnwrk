# Purity rule (docs/PLAN.md §2): this crate takes nothing from the outside world.
# Clippy resolves the real target of every call, so renamed or grouped imports cannot hide it.
# This file replaces the root clippy.toml for this crate, so the test allowances are repeated.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true

disallowed-types = [
  { path = "std::fs::File", reason = "pure crate: no file system" },
  { path = "std::fs::OpenOptions", reason = "pure crate: no file system" },
  { path = "std::net::TcpStream", reason = "pure crate: no network" },
  { path = "std::net::TcpListener", reason = "pure crate: no network" },
  { path = "std::net::UdpSocket", reason = "pure crate: no network" },
  { path = "std::process::Command", reason = "pure crate: no processes" },
  { path = "std::time::SystemTime", reason = "pure crate: time comes from Clock" },
  { path = "std::time::Instant", reason = "pure crate: time comes from Clock" },
  { path = "std::collections::HashMap", reason = "random iteration order; use BTreeMap" },
  { path = "std::collections::HashSet", reason = "random iteration order; use BTreeSet" },
]

disallowed-methods = [
  { path = "std::fs::read", reason = "pure crate: no file system" },
  { path = "std::fs::read_to_string", reason = "pure crate: no file system" },
  { path = "std::fs::write", reason = "pure crate: no file system" },
  { path = "std::fs::read_dir", reason = "pure crate: no file system" },
  { path = "std::fs::remove_file", reason = "pure crate: no file system" },
  { path = "std::fs::create_dir_all", reason = "pure crate: no file system" },
  { path = "std::env::var", reason = "pure crate: no environment" },
  { path = "std::env::var_os", reason = "pure crate: no environment" },
  { path = "std::env::vars", reason = "pure crate: no environment" },
  { path = "std::env::args", reason = "pure crate: no environment" },
  { path = "std::env::current_dir", reason = "pure crate: no environment" },
  { path = "std::thread::spawn", reason = "pure crate: no threads" },
  { path = "std::thread::sleep", reason = "pure crate: no threads" },
  { path = "std::process::exit", reason = "pure crate: never exits" },
  { path = "std::io::stdin", reason = "pure crate: no standard streams" },
  { path = "std::io::stdout", reason = "pure crate: no standard streams" },
  { path = "std::io::stderr", reason = "pure crate: no standard streams" },
  { path = "std::time::SystemTime::now", reason = "pure crate: time comes from Clock" },
  { path = "std::time::Instant::now", reason = "pure crate: time comes from Clock" },
  { path = "jiff::Timestamp::now", reason = "pure crate: time comes from Clock" },
  { path = "jiff::Zoned::now", reason = "pure crate: time comes from Clock" },
  { path = "jiff::civil::Date::today", reason = "pure crate: time comes from Clock" },
]
