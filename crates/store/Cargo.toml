[package]
name = "plnwrk-store"
description = "The .plnwrk file format: container, encryption, migration."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
age.workspace = true
blake3.workspace = true
jiff.workspace = true
plnwrk-core.workspace = true
plnwrk-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zip.workspace = true

# age draws randomness through getrandom; in the browser it must use the Web Crypto API.
[target.'cfg(target_arch = "wasm32")'.dependencies]
age = { workspace = true, features = ["web-sys"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true
